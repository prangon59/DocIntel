[mypy]
python_version = 3.12
strict = false
ignore_missing_imports = true
disable_error_code = import-untyped
plugins = pydantic.mypy

[mypy-openpyxl.*]
ignore_missing_imports = true

[mypy-pandas.*]
ignore_missing_imports = true

[mypy-pytesseract.*]
ignore_missing_imports = true

[mypy-fitz.*]
ignore_missing_imports = true

[mypy-cv2.*]
ignore_missing_imports = true

[mypy-pgvector.*]
ignore_missing_imports = true

[mypy-celery.*]
ignore_missing_imports = true
